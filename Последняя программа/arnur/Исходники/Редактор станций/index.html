<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Редактор станций</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header id="top">
    <div class="brand">Редактор станций <span class="ver">макет 0.1</span></div>
    <input id="stName" class="name" title="Название станции" spellcheck="false">

    <div class="group">
        <button id="bNew" title="Новая пустая схема">Новая</button>
        <button id="bOpen" title="Открыть файл .json (Ctrl+O)">Открыть…</button>
        <button id="bSave" title="Сохранить в файл .json (Ctrl+S)">Сохранить</button>
        <select id="bExample" title="Загрузить готовый пример">
            <option value="">Пример…</option>
        </select>
        <button id="bExport" title="Черновик C#-кода схемы для программы станции">Экспорт в C#</button>
    </div>

    <div class="group">
        <button id="bUndo" title="Отменить (Ctrl+Z)">↶</button>
        <button id="bRedo" title="Вернуть (Ctrl+Y)">↷</button>
    </div>

    <div class="group seg" id="modeSeg">
        <button id="mEdit" class="on" title="Рисовать схему">Редактор</button>
        <button id="mTest" title="Проверить схему: маршруты, стрелки, занятость (M)">Испытание</button>
    </div>

    <div class="group checks">
        <label><input type="checkbox" id="vGrid" checked> Сетка</label>
        <label><input type="checkbox" id="vColors" checked> Цвета участков</label>
        <label><input type="checkbox" id="vNames" checked> Названия участков</label>
    </div>

    <div class="spacer"></div>
    <button id="bHelp" class="round" title="Справка и горячие клавиши">?</button>
    <input type="file" id="fileIn" accept=".json,application/json" hidden>
</header>

<main>
    <aside id="left">
        <div id="palette"></div>
        <div id="toolOpts" class="opts"></div>
    </aside>

    <section id="stage">
        <canvas id="cv"></canvas>
        <div id="testBanner" hidden>
            <b>Испытание.</b> ЛКМ по светофору, затем по пути — задать маршрут (по светофору ещё раз — отменить).
            ЛКМ по стрелке — перевести. ПКМ по пути — занять / освободить участок.
        </div>
        <div id="zoomBox">
            <button id="zOut" title="Отдалить">−</button>
            <span id="zVal">100%</span>
            <button id="zIn" title="Приблизить">+</button>
            <button id="zFit" title="Показать всю схему (F)">Вся схема</button>
        </div>
    </section>

    <aside id="right">
        <nav id="tabs">
            <button data-tab="props" class="on">Свойства</button>
            <button data-tab="secs">Участки</button>
            <button data-tab="routes">Маршруты</button>
            <button data-tab="checks">Проверка</button>
        </nav>
        <div id="tabBody"></div>
    </aside>
</main>

<footer id="status">
    <span id="sCell"></span>
    <span id="sHint"></span>
    <span id="sMsg"></span>
</footer>

<div id="modal" hidden>
    <div class="box">
        <div class="head"><b id="mTitle"></b><button id="mClose" class="round" title="Закрыть (Esc)">✕</button></div>
        <div id="mBody"></div>
    </div>
</div>

<script src="js/core.js"></script>
<script src="js/render.js"></script>
<script src="js/routes.js"></script>
<script src="js/export.js"></script>
<script src="js/examples.js"></script>
<script src="js/app.js"></script>
</body>
</html>
