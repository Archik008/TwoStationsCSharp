# Настройки вида схемы. Поменяйте число, сохраните файл и перезапустите программу.
# Удалите файл — он создастся заново со значениями по умолчанию.

# размер шрифта названий участков (1П, 4СП, Н-М1...), было 9.5
SectionLabelSize = 13

# жирный шрифт названий участков: 1 — да, 0 — нет
SectionLabelBold = 1

# зазор от пути до надписи участка (надпись сама отодвигается от пути)
SectionLabelGap = 3

# цвет названий участков: R,G,B
SectionLabelColor = 40,60,55

# размер шрифта названий маршрутных светофоров
SignalLabelSize = 13

# размер шрифта названий проходных и маневровых светофоров
SignalLabelSmallSize = 10

# размер шрифта номеров стрелок
SwitchLabelSize = 11

# упрощённый режим: вторая лампа у светофоров, где огней не меньше N (0 — выключить)
SimpleSecondLampMinLamps = 5

